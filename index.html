<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Fretes v3</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1000px;
        margin: auto;
        padding: 20px;
        background: #f5f7fa;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid #d0d7de;
      }
      .card {
        background: white;
        padding: 12px;
        border-radius: 12px;
        margin: 10px 0;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .painel {
        background: white;
        padding: 15px;
        border-radius: 12px;
        margin: 15px 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      button {
        background: #1976d2;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        opacity: 0.9;
      }

      h1 {
        text-align: center;
        color: #1976d2;
      }

      #resultado {
        background: #e8f5e9;
        padding: 15px;
        border-radius: 12px;
        margin-top: 15px;
      }

      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <h1>Sistema de Fretes v3</h1>

    <div class="grid">
      <div>
        <label>Cliente</label>
        <input id="cliente" />

        <label>Telefone</label>
        <input id="telefone" />

        <label>Status</label>
        <select id="status">
          <option value="Em Aberto">Em Aberto</option>
          <option value="Fechado">Fechado</option>
          <option value="Perdido">Perdido</option>
        </select>

        <label>Data do Serviço</label>
        <input type="date" id="dataServico" />

        <label>Origem</label>
        <input id="origem" />

        <label>Destino</label>
        <input id="destino" />

        <label>KM</label>
        <input type="number" id="km" step="0.01" />

        <label>Trânsito (h)</label>
        <input type="number" id="transito" step="0.01" />

        <label>Carga/Descarga (h)</label>
        <input type="number" id="carga" step="0.01" />
      </div>

      <div>
        <label>Hora Pai</label>
        <input type="number" id="horaPai" value="40" />

        <label>Hora Jhon</label>
        <input type="number" id="horaJhon" value="35" />

        <label>Ajudantes</label>
        <input type="number" id="ajudantes" value="0" />

        <label>Hora Ajudante</label>
        <input type="number" id="horaAjudante" value="20" />

        <label>Margem (R$)</label>
        <input type="number" id="margem" value="0" />
      </div>
    </div>

    <button onclick="calcular()">Calcular</button>
    <button onclick="salvar()">Salvar</button>

    <button onclick="exportarBackup()">💾 Fazer Backup</button>

    <button onclick="document.getElementById('arquivoBackup').click()">
      📂 Restaurar Backup
    </button>

    <input
      type="file"
      id="arquivoBackup"
      accept=".json"
      onchange="restaurarBackup(event)"
      style="display: none"
    />

    <div id="resultado"></div>

    <h3>Mensagem para WhatsApp</h3>

    <label>Margem Comercial (somente mensagem)</label>
    <input type="number" id="margemMensagem" value="30" />

    <textarea
      id="mensagemWhatsapp"
      rows="12"
      style="width: 100%; margin-top: 10px"
    ></textarea>

    <button onclick="copiarMensagem()">Copiar Mensagem</button>

    <label>Período Financeiro Inicial</label>
    <input type="date" id="dataFinInicial" onchange="listar()" />

    <label>Período Financeiro Final</label>
    <input type="date" id="dataFinFinal" onchange="listar()" />

    <div class="painel">
      <h3>Painel Financeiro (Somente Fechados)</h3>
      <div id="painel"></div>
    </div>

    <div class="painel">
      <h3>Agenda Operacional</h3>

      <button onclick="mostrarHistorico()">Ver Histórico</button>

      <div id="agenda"></div>

      <div id="historico"></div>
    </div>

    <label>Pesquisar</label>
    <input id="pesquisa" onkeyup="listar()" />

    <label>Filtro</label>
    <select id="filtro" onchange="listar()">
      <option value="Todos">Todos</option>
      <option value="Em Aberto">Em Aberto</option>
      <option value="Fechado">Fechado</option>
      <option value="Perdido">Perdido</option>
    </select>

    <label>Data Inicial</label>
    <input type="date" id="dataInicial" onchange="listar()" />

    <label>Data Final</label>
    <input type="date" id="dataFinal" onchange="listar()" />

    <h3 id="totalFiltrado">Total: R$ 0,00</h3>

    <div id="lista"></div>

    <script>
      let editando = null;
      let ultimo = {};

      // ===== DOM HELPERS (blindado contra undefined) =====
      const el = (id) => document.getElementById(id);

      // ===== CÁLCULO =====
      function calcular() {
        let km = parseFloat(el('km').value) || 0;
        let trans = parseFloat(el('transito').value) || 0;
        let carg = parseFloat(el('carga').value) || 0;

        let pai = parseFloat(el('horaPai').value) || 0;
        let jhon = parseFloat(el('horaJhon').value) || 0;

        let aj = parseInt(el('ajudantes').value) || 0;
        let hAj = parseFloat(el('horaAjudante').value) || 0;

        let margemV = parseFloat(el('margem').value) || 0;

        let tempoReal = trans + carg;
        let horaTotal = pai + jhon;
        let tempoMargem = horaTotal ? margemV / horaTotal : 0;
        let tempoOrc = tempoReal + tempoMargem;

        let custoCarro = km * 1.77;
        let partePai = tempoOrc * pai;
        let parteJhon = tempoOrc * jhon;
        let custoAjud = tempoReal * aj * hAj;

        let valor = custoCarro + partePai + parteJhon + custoAjud;

        ultimo = {
          valor,
          partePai,
          parteJhon,
          custoCarro,
          custoAjud,

          origem: el('origem').value,
          destino: el('destino').value,
          cliente: el('cliente').value,

          codigo: `${km.toFixed(0)}-${tempoOrc.toFixed(2)}`,
        };

        el('resultado').innerHTML = `
      <h3>Código: ${ultimo.codigo}</h3>
      <p>Valor Final: <b>R$ ${valor.toFixed(2)}</b></p>
      <p>Pai: R$ ${partePai.toFixed(2)}</p>
      <p>Jhon: R$ ${parteJhon.toFixed(2)}</p>
      <p>Ajudantes: R$ ${custoAjud.toFixed(2)}</p>
      `;

        let margemMsg = parseFloat(el('margemMensagem').value) || 0;

        let valorCheio = valor + margemMsg;

        el('mensagemWhatsapp').value =
          `${ultimo.cliente}, agradeço pelo contato! 😊

📍 ${ultimo.origem} → ${ultimo.destino}

Orçamento: ${ultimo.codigo}

💰 O frete fica em R$ ${valorCheio.toFixed(2)}

*Consigo fazer por R$ ${valor.toFixed(2)} pra fecharmos hoje* 🤝

👉 Apenas transporte, sem carga e descarga.

Formas de pagamento:
PIX, crédito à vista ou parcelado por aproximação.(+ taxas)`;
      }

      // ===== SALVAR =====
      function salvar() {
        calcular();

        if (!ultimo.valor) {
          alert('Calcule primeiro');
          return;
        }

        let lista = JSON.parse(localStorage.getItem('orcamentosV3') || '[]');

        let obj = {
          cliente: el('cliente').value || '',
          telefone: el('telefone').value || '',
          status: el('status').value || 'Em Aberto',

          origem: el('origem').value || '',
          destino: el('destino').value || '',
          dataServico: el('dataServico').value || '',

          dataCriacao:
            editando !== null
              ? lista[editando].dataCriacao
              : new Date().toLocaleDateString('pt-BR'),

          km: el('km').value,
          transito: el('transito').value,
          carga: el('carga').value,
          horaPai: el('horaPai').value,
          horaJhon: el('horaJhon').value,
          ajudantes: el('ajudantes').value,
          horaAjudante: el('horaAjudante').value,
          margem: el('margem').value,

          ...ultimo,
        };

        if (editando !== null) {
          lista[editando] = obj;
          editando = null;
        } else {
          lista.push(obj);
        }

        localStorage.setItem('orcamentosV3', JSON.stringify(lista));

        function copiarMensagem() {
          let texto = el('mensagemWhatsapp');

          texto.select();

          document.execCommand('copy');

          alert('Mensagem copiada!');
        }

        function mostrarHistorico() {
          let lista = JSON.parse(localStorage.getItem('orcamentosV3') || '[]');

          let hoje = new Date().toISOString().split('T')[0];

          let html = '';

          lista.forEach((o) => {
            if (
              o.status === 'Fechado' &&
              o.dataServico &&
              o.dataServico < hoje
            ) {
              html += `
        <div class="card">

          <b>${o.cliente}</b><br>

          ${o.dataServico.split('-').reverse().join('/')}

          <br>

          R$ ${o.valor.toFixed(2)}

        </div>
      `;
            }
          });

          document.getElementById('historico').innerHTML =
            html || 'Nenhum serviço realizado.';
        }

        listar();
        alert('Salvo!');
      }

      // ===== LISTAR =====
      function listar() {
        let listaDados = JSON.parse(
          localStorage.getItem('orcamentosV3') || '[]',
        );

        let filtro = el('filtro').value;
        let busca = el('pesquisa').value.toLowerCase();

        let dataInicial = el('dataInicial').value;
        let dataFinal = el('dataFinal').value;

        let dataFinInicial = el('dataFinInicial')?.value || '';
        let dataFinFinal = el('dataFinFinal')?.value || '';

        let html = '';
        let total = 0;

        let fechados = 0,
          abertos = 0,
          perdidos = 0,
          pai = 0,
          jhon = 0,
          ajud = 0,
          carro = 0;

        let agendaHtml = '';

        let servicosAgenda = [];

        let servicosFinanceiros = [];

        listaDados.forEach((o, i) => {
          if (filtro !== 'Todos' && o.status !== filtro) return;

          if (dataInicial && o.dataCriacao) {
            let partes = o.dataCriacao.split('/');
            let dataObj = `${partes[2]}-${partes[1]}-${partes[0]}`;

            if (dataObj < dataInicial) return;
          }

          if (dataFinal && o.dataCriacao) {
            let partes = o.dataCriacao.split('/');
            let dataObj = `${partes[2]}-${partes[1]}-${partes[0]}`;

            if (dataObj > dataFinal) return;
          }

          if (
            busca &&
            !o.cliente.toLowerCase().includes(busca) &&
            !o.telefone.toLowerCase().includes(busca)
          )
            return;

          total += o.valor;

          if (o.status === 'Em Aberto') abertos += o.valor || 0;

          if (o.status === 'Perdido') perdidos += o.valor || 0;

          html += `
<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;">

  <div>
    <b style="font-size:18px;">
      ${o.cliente}
    </b>
    <br>
    ${o.telefone}
  </div>

  <div style="
    background:#1976d2;
    color:white;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
  ">
    ${o.status}
  </div>

</div>

<hr>

📍 ${o.origem || '-'}
<br>
➡️ ${o.destino || '-'}

<br><br>

💰 <b>R$ ${o.valor.toFixed(2)}</b>

<br>

📅 Criação:
${o.dataCriacao}

<br>

🚚 Serviço:
${o.dataServico ? o.dataServico.split('-').reverse().join('/') : '-'}

<br><br>

<button onclick="editar(${i})">
Editar
</button>

<button onclick="excluirO(${i})">
Excluir
</button>

</div>
`;
        });

        // painel fechado
        listaDados.forEach((o) => {
          if (o.status !== 'Fechado') return;

          // ===== AGENDA =====

          if (o.dataServico) {
            servicosAgenda.push(o);
          }

          // ===== FINANCEIRO =====

          if (o.dataServico) {
            if (dataFinInicial && o.dataServico < dataFinInicial) return;

            if (dataFinFinal && o.dataServico > dataFinFinal) return;
          }

          servicosFinanceiros.push(o);

          fechados += o.valor || 0;
          pai += o.partePai || 0;
          jhon += o.parteJhon || 0;
          ajud += o.custoAjud || 0;
          carro += o.custoCarro || 0;
        });

        servicosAgenda.sort((a, b) =>
          a.dataServico.localeCompare(b.dataServico),
        );

        let dataAtual = '';

        const hoje = new Date().toISOString().split('T')[0];

        servicosAgenda.forEach((o) => {
          if (o.dataServico < hoje) return;

          if (o.dataServico !== dataAtual) {
            dataAtual = o.dataServico;

            agendaHtml += `
      <h4>
        ${o.dataServico.split('-').reverse().join('/')}
      </h4>
    `;
          }

          agendaHtml += `
    <div class="card">
      <b>${o.cliente}</b><br>

      ${o.origem || '-'}
      →
      ${o.destino || '-'}
      <br>

      R$ ${o.valor.toFixed(2)}
    </div>
  `;
        });

        el('lista').innerHTML = html;
        el('totalFiltrado').innerHTML = 'Total: R$ ' + total.toFixed(2);

        el('painel').innerHTML = `

<div style="
background:#e8f5e9;
padding:12px;
border-radius:10px;
margin-bottom:10px;
">

<b>🟢 FECHADOS</b><br>

R$ ${fechados.toFixed(2)}

</div>

<div style="
background:#fff8e1;
padding:12px;
border-radius:10px;
margin-bottom:10px;
">

<b>🟡 EM ABERTO</b><br>

R$ ${abertos.toFixed(2)}

</div>

<div style="
background:#ffebee;
padding:12px;
border-radius:10px;
margin-bottom:15px;
">

<b>🔴 PERDIDOS</b><br>

R$ ${perdidos.toFixed(2)}

</div>

<hr>

<b>Período Financeiro</b><br>

${dataFinInicial || 'Início'}
até
${dataFinFinal || 'Hoje'}

<br><br>

<b>Comissão Pai:</b>
R$ ${pai.toFixed(2)}
<br>

<b>Sua Comissão:</b>
R$ ${jhon.toFixed(2)}
<br>

<b>Ajudantes:</b>
R$ ${ajud.toFixed(2)}
<br>

<b>Carro:</b>
R$ ${carro.toFixed(2)}

`;

        el('agenda').innerHTML = agendaHtml || 'Nenhum serviço agendado.';
      }

      // ===== EDITAR =====
      function editar(i) {
        let lista = JSON.parse(localStorage.getItem('orcamentosV3') || '[]');
        let o = lista[i];

        el('cliente').value = o.cliente;
        el('telefone').value = o.telefone;
        el('status').value = o.status;

        el('origem').value = o.origem || '';
        el('destino').value = o.destino || '';
        el('dataServico').value = o.dataServico || '';

        el('km').value = o.km;
        el('transito').value = o.transito;
        el('carga').value = o.carga;
        el('horaPai').value = o.horaPai;
        el('horaJhon').value = o.horaJhon;
        el('ajudantes').value = o.ajudantes;
        el('horaAjudante').value = o.horaAjudante;
        el('margem').value = o.margem;

        editando = i;
        calcular();
      }

      // ===== EXCLUIR =====
      function excluirO(i) {
        if (!confirm('Excluir orçamento?')) return;

        let lista = JSON.parse(localStorage.getItem('orcamentosV3') || '[]');

        lista.splice(i, 1);

        localStorage.setItem('orcamentosV3', JSON.stringify(lista));

        listar();
      }

      function exportarBackup() {
        let dados = localStorage.getItem('orcamentosV3');

        if (!dados) {
          alert('Nenhum orçamento para salvar.');
          return;
        }

        let blob = new Blob([dados], { type: 'application/json' });

        let link = document.createElement('a');

        let data = new Date();

        let nome =
          'backup-fretes-' +
          data.getFullYear() +
          '-' +
          String(data.getMonth() + 1).padStart(2, '0') +
          '-' +
          String(data.getDate()).padStart(2, '0') +
          '.json';

        link.href = URL.createObjectURL(blob);

        link.download = nome;

        link.click();

        URL.revokeObjectURL(link.href);
      }

      function restaurarBackup(event) {
        let arquivo = event.target.files[0];

        if (!arquivo) return;

        let leitor = new FileReader();

        leitor.onload = function (e) {
          try {
            let dados = JSON.parse(e.target.result);

            if (!Array.isArray(dados)) {
              alert('Arquivo inválido.');
              return;
            }

            if (
              !confirm(
                'Isso substituirá todos os orçamentos atuais. Continuar?',
              )
            ) {
              return;
            }

            localStorage.setItem('orcamentosV3', JSON.stringify(dados));

            listar();

            alert('Backup restaurado com sucesso!');
          } catch {
            alert('Arquivo inválido.');
          }
        };

        leitor.readAsText(arquivo);
      }

      // inicializa
      listar();
    </script>
  </body>
</html>
